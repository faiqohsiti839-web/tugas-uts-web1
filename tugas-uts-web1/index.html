<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk | Toko Buku UT</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login" class="login-body">
  <main class="login-card">
    <h1>Toko Buku UT</h1>
    <p class="muted">Masuk untuk melihat stok, memesan, dan melacak kiriman.</p>
    <form id="formLogin" novalidate>
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="rina@gmail.com" required>
      <label for="password">Password</label>
      <input type="password" id="password" required>
      <button type="submit" class="btn">Login</button>
    </form>
    <p class="login-links">
      <button type="button" class="link" id="btnLupa">Lupa Password</button>
      <button type="button" class="link" id="btnDaftar">Daftar</button>
    </p>
  </main>
  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
